name: Build macOS ARM64 package

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to build (branch, tag, or commit)"
        required: false
        default: "develop"
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/build_macos_arm64_package.yml"
      - "i18n/mayo_zh.ts"
      - "i18n/mayo.qrc"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build portable macOS ARM64 package
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Show runner architecture
        run: |
          uname -a
          uname -m
          sw_vers

      - name: Install build dependencies
        run: |
          brew install qt@6 opencascade assimp

      - name: Compile Simplified Chinese translation
        run: |
          QT_PREFIX="$(brew --prefix qt@6)"
          LRELEASE="$QT_PREFIX/bin/lrelease"
          if [ ! -x "$LRELEASE" ]; then
            LRELEASE="$QT_PREFIX/libexec/lrelease"
          fi
          test -x "$LRELEASE"
          "$LRELEASE" i18n/mayo_zh.ts -qm i18n/mayo_zh.qm
          test -s i18n/mayo_zh.qm

      - name: Configure
        run: |
          QT_PREFIX="$(brew --prefix qt@6)"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMayo_BuildTests=OFF \
            -DMayo_BuildPluginAssimp=ON \
            -DQT_DIR="$QT_PREFIX/lib/cmake/Qt6"

      - name: Build
        run: |
          cmake --build build --config Release --parallel "$(sysctl -n hw.ncpu)"
          test -d build/mayo.app
          file build/mayo.app/Contents/MacOS/mayo
          lipo -archs build/mayo.app/Contents/MacOS/mayo

      - name: Deploy Qt frameworks and plugins
        run: |
          QT_PREFIX="$(brew --prefix qt@6)"
          "$QT_PREFIX/bin/macdeployqt" build/mayo.app -always-overwrite -verbose=2

      - name: Verify SVG icon runtime is bundled
        run: |
          test -f build/mayo.app/Contents/PlugIns/iconengines/libqsvgicon.dylib
          test -f build/mayo.app/Contents/Frameworks/QtSvg.framework/Versions/A/QtSvg
          otool -L build/mayo.app/Contents/PlugIns/iconengines/libqsvgicon.dylib
          if otool -L build/mayo.app/Contents/PlugIns/iconengines/libqsvgicon.dylib | grep -q "/opt/homebrew/"; then
            echo "SVG icon plugin still depends on Homebrew QtSvg"
            exit 1
          fi

      - name: Bundle non-system Homebrew libraries
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          app = Path("build/mayo.app").resolve()
          frameworks = app / "Contents" / "Frameworks"
          frameworks.mkdir(parents=True, exist_ok=True)

          def run(*args, check=True):
              p = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if check and p.returncode != 0:
                  raise RuntimeError(
                      "Command failed: " + " ".join(args) + "\n" + p.stdout + "\n" + p.stderr
                  )
              return p

          def is_macho(path: Path) -> bool:
              if not path.is_file() or path.is_symlink():
                  return False
              p = run("file", str(path), check=False)
              return "Mach-O" in p.stdout

          def dependencies(path: Path):
              p = run("otool", "-L", str(path))
              deps = []
              for line in p.stdout.splitlines()[1:]:
                  line = line.strip()
                  if line:
                      deps.append(line.split(" (compatibility version", 1)[0])
              return deps

          def external_abs(dep: str) -> bool:
              if not dep.startswith("/"):
                  return False
              if dep.startswith("/System/Library/") or dep.startswith("/usr/lib/"):
                  return False
              try:
                  p = Path(dep).resolve()
                  if app in p.parents:
                      return False
              except Exception:
                  pass
              return True

          def loader_ref(binary: Path, target: Path) -> str:
              rel = os.path.relpath(target, binary.parent).replace(os.sep, "/")
              return f"@loader_path/{rel}"

          def copy_dependency(dep: str) -> Path:
              src = Path(dep)
              if not src.exists():
                  raise FileNotFoundError(f"Dependency does not exist: {dep}")
              dst = frameworks / src.name
              if not dst.exists():
                  print(f"Bundling: {src} -> {dst}")
                  shutil.copy2(src.resolve(), dst)
                  os.chmod(dst, 0o755)
              # Keep a conventional install-name; dependants are rewritten below
              # to concrete @loader_path references inside the application bundle.
              run("install_name_tool", "-id", f"@rpath/{dst.name}", str(dst), check=False)
              return dst

          # Pass 1: recursively copy every absolute non-system dependency into
          # Contents/Frameworks and rewrite the referencing binary.
          queue = [p for p in app.rglob("*") if is_macho(p)]
          seen = set()

          while queue:
              binary = queue.pop(0)
              key = str(binary)
              if key in seen or not binary.exists():
                  continue
              seen.add(key)

              for dep in dependencies(binary):
                  # Skip a dylib's own install-name entry.
                  if Path(dep).name == binary.name:
                      continue
                  if not external_abs(dep):
                      continue

                  dst = copy_dependency(dep)
                  new_ref = loader_ref(binary, dst)
                  print(f"Rewriting absolute dependency in {binary}: {dep} -> {new_ref}")
                  run("install_name_tool", "-change", dep, new_ref, str(binary))
                  queue.append(dst)

          # Pass 2: Homebrew OpenCascade libraries commonly reference each other
          # as @rpath/libTK*.dylib. Those references worked on the build runner
          # because Homebrew supplied LC_RPATH entries, but fail on another Mac.
          # Rewrite any bundled dylib reached through @rpath to a direct
          # @loader_path reference inside Contents/Frameworks.
          machos = [p for p in app.rglob("*") if is_macho(p)]
          for binary in machos:
              for dep in dependencies(binary):
                  if not dep.startswith("@rpath/") or ".framework/" in dep:
                      continue
                  candidate = frameworks / Path(dep).name
                  if not candidate.exists() or candidate.resolve() == binary.resolve():
                      continue
                  new_ref = loader_ref(binary, candidate)
                  print(f"Rewriting rpath dependency in {binary}: {dep} -> {new_ref}")
                  run("install_name_tool", "-change", dep, new_ref, str(binary))

          print("\nBundled external libraries:")
          for p in sorted(frameworks.iterdir()):
              if p.is_file():
                  print(" -", p.name)
          PY

      - name: Verify no absolute non-system dependencies remain
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess
          from pathlib import Path

          app = Path("build/mayo.app").resolve()
          bad = []

          for path in app.rglob("*"):
              if not path.is_file() or path.is_symlink():
                  continue
              f = subprocess.run(["file", str(path)], text=True, capture_output=True)
              if "Mach-O" not in f.stdout:
                  continue
              o = subprocess.run(["otool", "-L", str(path)], text=True, capture_output=True, check=True)
              for line in o.stdout.splitlines()[1:]:
                  dep = line.strip().split(" (compatibility version", 1)[0]
                  # otool -L lists a dylib/framework's own install-name as an entry.
                  # It is metadata, not an unresolved runtime dependency.
                  if Path(dep).name == path.name:
                      continue

                  if dep.startswith("@rpath/") and dep.endswith(".dylib"):
                      bad.append((str(path), dep))
                      continue

                  if not dep.startswith("/"):
                      continue
                  if dep.startswith("/System/Library/") or dep.startswith("/usr/lib/"):
                      continue
                  if dep.startswith(str(app)):
                      continue
                  bad.append((str(path), dep))

          if bad:
              print("External absolute dependencies remain:")
              for binary, dep in bad:
                  print(f"  {binary}\n    -> {dep}")
              raise SystemExit(1)

          print("Dependency check passed: no external absolute non-system dylibs remain.")
          PY

      - name: Ad-hoc sign application bundle
        run: |
          codesign --force --deep --sign - --timestamp=none build/mayo.app
          codesign --verify --deep --strict --verbose=2 build/mayo.app

      - name: Smoke test packaged application
        run: |
          build/mayo.app/Contents/MacOS/mayo --version
          build/mayo.app/Contents/MacOS/mayo --help >/tmp/mayo-help.txt
          test -s /tmp/mayo-help.txt

      - name: Create ZIP and DMG
        run: |
          mkdir -p dist/dmg-root
          ditto build/mayo.app "dist/dmg-root/Mayo.app"
          ln -s /Applications "dist/dmg-root/Applications"

          ditto -c -k --sequesterRsrc --keepParent \
            "dist/dmg-root/Mayo.app" \
            "dist/Mayo-macOS-arm64.zip"

          hdiutil create \
            -volname "Mayo" \
            -srcfolder "dist/dmg-root" \
            -ov \
            -format UDZO \
            "dist/Mayo-macOS-arm64.dmg"

          shasum -a 256 dist/Mayo-macOS-arm64.zip dist/Mayo-macOS-arm64.dmg | tee dist/SHA256SUMS.txt

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: Mayo-macOS-arm64
          path: |
            dist/Mayo-macOS-arm64.zip
            dist/Mayo-macOS-arm64.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-macos]')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.11.0-dev-macos-arm64-3
        run: |
          gh --version
          gh release create "$RELEASE_TAG" \
            dist/Mayo-macOS-arm64.dmg \
            dist/Mayo-macOS-arm64.zip \
            dist/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Mayo 0.11.0-dev macOS ARM64 (Chinese enhanced, QtSvg fix)" \
            --notes "Personal-use Apple Silicon build from Mayo develop branch. Includes Qt 6, OpenCascade, Assimp runtime dependencies, refined Simplified Chinese translation, ad-hoc code signing, DMG/ZIP packages and SHA-256 checksums. This build is not notarized with an Apple Developer ID."
